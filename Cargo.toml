[package]
name = "seepass"
version = "8.4.0"
edition = "2021"
description = "SeePass - an offline, single-file, authenticated-encryption password manager"
license-file = "LICENSE"
repository = "https://github.com/Akulav/seepass"
readme = "README.md"
publish = false

[[bin]]
name = "seepass"
path = "src/main.rs"

[lib]
name = "seepass"
path = "src/lib.rs"

[dependencies]
# Vault crypto
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "5"
zxcvbn = "3"

# Desktop UI
eframe = "0.31"
rfd = "0.18"
arboard = "3"

[dev-dependencies]
egui_kittest = { version = "0.31", features = ["wgpu", "snapshot"] }
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Argon2 is painfully slow unoptimised; keep tests usable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
